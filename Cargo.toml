[workspace]
resolver = "2"
members = [
    "crates/urdia-core",
    "crates/urdia-acp",
    "crates/urdia-provider-qwen",
    "crates/urdia-store-sqlite",
    "crates/urdia-ui",
    "crates/urdia-routing",
    "crates/urdia-decision-jev",
    "crates/urdia-decision-laya",
    "crates/urdia-decision-typellm",
    "crates/urdia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Urdia contributors"]
repository = "https://github.com/SaulineytorX/urdia"
homepage = "https://github.com/SaulineytorX/urdia"
description = "An open, provider-neutral workspace for coding agents"

[workspace.dependencies]
agent-client-protocol = "2.2.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5.47", features = ["derive"] }
rusqlite = "0.40.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
